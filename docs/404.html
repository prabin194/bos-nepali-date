<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — bos-nepali-date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--text:#0f1117;--text2:#525866;--accent:#b45309;font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.7;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.dark{--bg:#0b0d10;--text:#edf0f5;--text2:#9498a3}
html{scroll-behavior:smooth}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{text-align:center;max-width:400px}
.card .code{font-size:5rem;font-weight:800;background:linear-gradient(135deg,var(--accent),#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:12px}
.card h1{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.card p{color:var(--text2);font-size:14px;margin-bottom:24px}
.card a{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:6px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;transition:filter 0.15s}
.card a:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="card">
<div class="code">404</div>
<h1>Page not found</h1>
<p>The page you're looking for doesn't exist or has been moved.</p>
<a href="./">← Back to home</a>
</div>
<script>
(function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
</script>
</body>
</html>
